name: Build and Deploy Pelican Site

on:
  push:
    branches:
      - master
  workflow_dispatch:
  repository_dispatch:
    types: [cv-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout private CV
        uses: actions/checkout@v4
        with:
          repository: andre-motta/personal_cv
          ref: main
          token: ${{ secrets.PERSONAL_CV_REPO_TOKEN }}
          path: .cv-source
          sparse-checkout: Andre_Motta_Resume.pdf
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Add current CV to site
        run: |
          test -s .cv-source/Andre_Motta_Resume.pdf
          cp .cv-source/Andre_Motta_Resume.pdf content/extra/Andre_Motta_Resume.pdf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build site
        run: |
          pelican content -s publishconf.py

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./output

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
