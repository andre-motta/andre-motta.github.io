name: Build and Deploy Astro Site

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [cv-updated]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout site
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Check dependency advisories
        run: npm audit --audit-level=high

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Test CV importer with public fixture
        run: python scripts/test_import_cv.py

      - name: Generate fixture CV for pull requests
        if: github.ref != 'refs/heads/master' || github.event_name == 'pull_request'
        run: python scripts/import-cv.py --fixture --output .generated/cv.json

      - name: Checkout private CV
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch')
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: andre-motta/personal_cv
          ref: main
          token: ${{ secrets.PERSONAL_CV_REPO_TOKEN }}
          path: .cv-source
          sparse-checkout: |
            cv.md
            Andre_Motta_Resume.pdf
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Import and validate private CV
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch')
        run: >-
          python scripts/import-cv.py
          --source-dir .cv-source
          --output .generated/cv.json
          --pdf-destination public/extra/Andre_Motta_Resume.pdf

      - name: Remove private CV checkout
        if: always() && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch')
        run: rm -rf .cv-source

      - name: Check Astro project
        run: npm run check

      - name: Build production site
        env:
          INCLUDE_DRAFTS: ''
          ASTRO_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Verify fixture site artifact
        if: github.ref != 'refs/heads/master' || github.event_name == 'pull_request'
        run: python scripts/verify_site.py --output output --allow-missing-cv

      - name: Verify release site artifact
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch')
        run: python scripts/verify_site.py --output output

      - name: Verify release CV PDF
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch')
        run: |
          test -s output/extra/Andre_Motta_Resume.pdf
          test "$(head -c 4 output/extra/Andre_Motta_Resume.pdf)" = '%PDF'

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch')
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ./output

  deploy:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
