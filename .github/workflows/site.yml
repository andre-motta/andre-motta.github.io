name: Build and Deploy Astro Site

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [cv-updated]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Check dependency advisories
        run: npm audit --audit-level=high

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Test CV importer with public fixture
        run: python scripts/test_import_cv.py

      - name: Generate fixture CV for pull requests
        if: github.ref != 'refs/heads/master' || github.event_name == 'pull_request'
        run: python scripts/import-cv.py --fixture --output .generated/cv.json

      - name: Checkout private CV
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch')
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: andre-motta/personal_cv
          ref: main
          token: ${{ secrets.PERSONAL_CV_REPO_TOKEN }}
          path: .cv-source
          sparse-checkout: |
            cv.md
            Andre_Motta_Resume.pdf
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Import and validate private CV
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch')
        run: >-
          python scripts/import-cv.py
          --source-dir .cv-source
          --output .generated/cv.json
          --pdf-destination public/extra/Andre_Motta_Resume.pdf

      - name: Remove private CV checkout
        if: always() && github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch')
        run: rm -rf .cv-source

      - name: Check Astro project
        run: npm run check

      - name: Build production site
        env:
          INCLUDE_DRAFTS: ''
          ASTRO_TELEMETRY_DISABLED: '1'
        run: npm run build

      - name: Verify fixture site artifact
        if: github.ref != 'refs/heads/master' || github.event_name == 'pull_request'
        run: python scripts/verify_site.py --output output --allow-missing-cv

      - name: Verify release site artifact
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch')
        run: python scripts/verify_site.py --output output

      - name: Verify release CV PDF
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch')
        run: |
          test -s output/extra/Andre_Motta_Resume.pdf
          test "$(head -c 4 output/extra/Andre_Motta_Resume.pdf)" = '%PDF'

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./output

  deploy:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
