<!DOCTYPE html>
<html lang="{{ DEFAULT_LANG }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ SITENAME }}{% endblock %}</title>
    <meta name="description" content="{% block description %}{{ SITE_DESCRIPTION }}{% endblock %}">
    <script>
        (function() {
            var theme = localStorage.getItem('theme');
            if (theme) {
                document.documentElement.setAttribute('data-theme', theme);
            }
        })();
        function toggleTheme() {
            var html = document.documentElement;
            var current = html.getAttribute('data-theme');
            var isDark;
            if (current === 'dark') {
                isDark = false;
            } else if (current === 'light') {
                isDark = true;
            } else {
                isDark = !window.matchMedia('(prefers-color-scheme: dark)').matches;
            }
            var next = isDark ? 'dark' : 'light';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            updateToggleIcon(next);
        }
        function updateToggleIcon(theme) {
            var btn = document.getElementById('theme-toggle-btn');
            if (!btn) return;
            var isDark = theme === 'dark' ||
                (!theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
            btn.textContent = isDark ? '☀︎' : '☽︎';
        }
        document.addEventListener('DOMContentLoaded', function() {
            updateToggleIcon(localStorage.getItem('theme'));
        });
    </script>
    <link rel="stylesheet" href="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/css/main.css">
</head>
<body>
    <header>
        <div class="header-row">
            <h1><a href="{{ SITEURL }}/">{{ SITENAME }}</a></h1>
            <button class="theme-toggle" id="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle dark mode" title="Toggle dark mode"></button>
        </div>
        <p>{{ AUTHOR_BIO }}</p>
        <nav>
            {% for title, link in MENUITEMS %}
                <a href="{{ link }}">{{ title }}</a>
            {% endfor %}
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>
            {% for name, link in SOCIAL %}
                <a href="{{ link }}">{{ name }}</a>
            {% endfor %}
            <a href="mailto:{{ AUTHOR_EMAIL }}">Email</a>
        </p>
        <p>&copy; {{ CURRENT_YEAR }} {{ AUTHOR }}</p>
    </footer>
</body>
</html>
